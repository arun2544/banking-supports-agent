# Edge layer from the diagram: reverse proxy / API gateway in front of the app.
# Add a WAF (ModSecurity + OWASP CRS, or your cloud WAF) and DDoS protection (Cloudflare/AWS Shield) in front of this.
limit_req_zone $binary_remote_addr zone=chat:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 443 ssl http2;
    server_name bank-support.example.com;
    ssl_certificate     /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16k;
    limit_conn perip 20;
    # modsecurity on; modsecurity_rules_file /etc/nginx/modsec/main.conf;

    location = /auth/login { limit_req zone=login burst=3 nodelay; proxy_pass http://127.0.0.1:8000; }
    location /chat         { limit_req zone=chat  burst=10 nodelay; proxy_pass http://127.0.0.1:8000; proxy_read_timeout 120s; }
    location /metrics      { allow 10.0.0.0/8; deny all; proxy_pass http://127.0.0.1:8000; }   # internal only
    location /             { proxy_pass http://127.0.0.1:8000; proxy_set_header X-Request-ID $request_id;
                             proxy_set_header X-Forwarded-For $remote_addr; }
}
